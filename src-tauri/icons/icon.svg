<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2440"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="#2d4a6f" stroke-width="4"/>
  <!-- Box icon - main warehouse box -->
  <g transform="translate(156, 160)">
    <!-- Box body -->
    <rect x="0" y="40" width="200" height="120" rx="10" fill="url(#box1)" stroke="#1d4ed8" stroke-width="3"/>
    <!-- Box flap left -->
    <polygon points="0,40 60,0 100,40" fill="#60a5fa" stroke="#1d4ed8" stroke-width="3"/>
    <!-- Box flap right -->
    <polygon points="100,40 140,0 200,40" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/>
    <!-- Box center line -->
    <line x1="100" y1="40" x2="100" y2="160" stroke="#1d4ed8" stroke-width="2" opacity="0.4"/>
    <!-- "AP" text on box -->
    <text x="100" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white" opacity="0.9">AP</text>
  </g>
  <!-- Small accent circles -->
  <circle cx="130" cy="340" r="8" fill="url(#box2)"/>
  <circle cx="382" cy="340" r="8" fill="url(#box3)"/>
  <circle cx="256" cy="380" r="6" fill="#64748b"/>
  <!-- Subtle gear hint -->
  <g transform="translate(370, 150)" opacity="0.3">
    <circle cx="0" cy="0" r="30" fill="none" stroke="white" stroke-width="4" stroke-dasharray="8 5"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="white" stroke-width="4"/>
    <circle cx="0" cy="0" r="6" fill="white"/>
  </g>
</svg>
